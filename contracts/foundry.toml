[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["../node_modules"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [{ access = "read", path = "../tests/fixtures" }]

[fmt]
# Vendored upstream snapshots stay byte-identical to their source; don't reformat.
ignore = ["src/vendor/*.sol"]

[etherscan]
base = { key = "${ETHERSCAN_API_KEY}" }

[profile.default.invariant]
runs = 1000
depth = 100
fail_on_revert = true
